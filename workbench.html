<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户经理工作台｜演示基线</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23097080'/%3E%3Cpath d='M12 34V16h8v18m8 0V10h8v24' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
:root{--paper:#f3f6f8;--ink:#19333d;--muted:#5d7079;--line:#d7e2e6;--brand:#097080;--wash:#e6f4f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 'PingFang SC','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #de8a32;outline-offset:3px}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:700}.brand small{display:block;font-size:14px;color:var(--muted);font-weight:400}.badge{font-size:14px;padding:4px 10px;background:var(--wash);border:1px solid #c1dfe3;border-radius:4px}main{max-width:1220px;margin:auto;padding:24px 18px 36px}h1{font-size:28px;margin:0 0 4px;line-height:1.4}h2{font-size:22px;margin:0}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0}.muted{color:var(--muted)}.intro{margin-bottom:24px}.layout{display:grid;gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:8px;min-width:0}.panel-title{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.filters{padding:16px 20px;display:flex;gap:12px;flex-wrap:wrap;background:#fafcfd}.field{flex:1;min-width:180px}.field label{display:block;font-size:14px;margin-bottom:5px;color:var(--muted)}input,select{width:100%;min-height:44px;border:1px solid #a8bcc5;border-radius:5px;background:white;padding:8px 10px}ul{margin:0;padding:0;list-style:none}.customer{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:17px 20px;background:white;color:var(--ink);min-height:90px}.customer:hover{background:#f3f9fa}.customer[aria-current="true"]{background:var(--wash);box-shadow:inset 4px 0 var(--brand)}.customer strong{font-size:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.customer .sub{font-size:14px;color:var(--muted);margin-top:5px}.status{font-size:14px;color:var(--brand);font-weight:500}.empty{padding:32px 20px}.detail{padding:22px}.detail-top{margin-bottom:24px}.avatar{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;background:var(--wash);border-radius:50%;color:var(--brand);font-size:20px;margin-bottom:12px}.facts{display:grid;grid-template-columns:1fr;gap:16px;margin:24px 0}.facts div{border-bottom:1px solid var(--line);padding-bottom:10px}dt{font-size:14px;color:var(--muted)}dd{margin:3px 0 0;font-weight:600}.note{background:#f4f8fa;padding:16px;border-radius:5px}.outline{border:1px solid #a8bcc5;background:white;color:var(--ink);border-radius:5px;padding:8px 14px;min-height:44px}footer{font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:16px}.version{font-family:ui-monospace,monospace;font-size:14px}.mobile-back{margin-bottom:16px}[hidden]{display:none!important}@media(min-width:768px){main{padding:32px 24px 40px}.layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.facts{grid-template-columns:1fr 1fr}.mobile-back{display:none}.detail{padding:26px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px}}@media(max-width:767px){.layout[data-detail="true"] #directory{display:none}.layout[data-detail="false"] #detail-panel{display:none}}
</style>
</head>
<body>
<header><div class="brand">客户经理工作台<small>Manager Workbench</small></div><span class="badge">虚构数据 · 演示环境</span></header>
<main>
<section class="intro"><div><h1>我的客户</h1><p class="muted">查看客户档案，快速了解服务背景。</p></div><div class="version">基线 v0.1.0 · <span id="commit">__BUILD_COMMIT__</span></div></section>
<div class="layout" id="layout" data-detail="false">
<section class="panel" id="directory" aria-label="客户列表"><div class="panel-title"><h2>客户列表</h2><span class="muted" id="count" aria-live="polite"></span></div>
<div class="filters"><div class="field"><label for="search">搜索客户</label><input id="search" type="search" placeholder="客户名称或演示编号" autocomplete="off"></div><div class="field"><label for="segment">客户类型</label><select id="segment"><option value="all">全部类型</option><option value="企业客户">企业客户</option><option value="个人客户">个人客户</option></select></div></div>
<ul id="customer-list"></ul><div class="empty" id="empty" hidden><h3>没有匹配的客户</h3><p class="muted">试试其他关键词或清除筛选条件。</p><button class="outline" id="reset">清除筛选</button></div></section>
<section class="panel" id="detail-panel" aria-label="客户详情"><div class="panel-title"><h2>客户详情</h2><span class="badge">只读档案</span></div><div class="detail" id="detail"></div></section>
</div>
<footer><p><b>演示基线：</b>当前仅提供客户列表与详情，尚未实现客户跟进提醒。</p><p>全部客户均为虚构样例，不接银行系统，不含真实客户资料。后续跟进记录仅保存在当前浏览器；换设备、换浏览器不共享，清除浏览器数据后会丢失。当前版本不写入跟进记录。</p></footer>
</main>
<script>
'use strict';
const CUSTOMERS=Object.freeze([
{id:'demo-001',name:'演示客户甲',segment:'企业客户',industry:'制造业（样例）',stage:'需求沟通',owner:'演示客户经理',summary:'关注结算效率，希望了解适合日常经营的服务流程。',note:'下次沟通可先确认企业日常结算场景。此为虚构服务背景，不构成产品推荐。'},
{id:'demo-002',name:'演示客户乙',segment:'个人客户',industry:'个人客户（样例）',stage:'资料了解',owner:'演示客户经理',summary:'希望了解账户日常使用与基础服务。',note:'可围绕账户使用习惯进行沟通，不涉及投资建议。'},
{id:'demo-003',name:'演示客户丙',segment:'企业客户',industry:'零售业（样例）',stage:'持续服务',owner:'演示客户经理',summary:'门店经营场景，希望梳理日常业务办理流程。',note:'客户详情仅用于演示列表与详情的交互。'},
{id:'demo-004',name:'演示客户丁',segment:'个人客户',industry:'个人客户（样例）',stage:'需求沟通',owner:'演示客户经理',summary:'希望了解线上与线下业务办理方式。',note:'没有真实手机号、账号或身份资料。'},
{id:'demo-005',name:'演示客户戊',segment:'企业客户',industry:'服务业（样例）',stage:'资料了解',owner:'演示客户经理',summary:'希望了解业务材料准备与办理步骤。',note:'后续沟通聚焦资料清单，不包含授信或风控判断。'},
{id:'demo-006',name:'演示客户己',segment:'企业客户',industry:'物流业（样例）',stage:'持续服务',owner:'演示客户经理',summary:'需要清晰的日常服务沟通渠道。',note:'全部内容为演示样例，无实际业务记录。'}
]);
const list=document.getElementById('customer-list');
const search=document.getElementById('search');
const segment=document.getElementById('segment');
let selectedId=CUSTOMERS[0].id;
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el;}
function renderList(){const term=search.value.trim().toLowerCase();const items=CUSTOMERS.filter(c=>(segment.value==='all'||c.segment===segment.value)&&(c.name.toLowerCase().includes(term)||c.id.includes(term)));list.replaceChildren();document.getElementById('count').textContent=`${items.length} / ${CUSTOMERS.length} 位客户`;document.getElementById('empty').hidden=items.length>0;for(const c of items){const li=element('li');const btn=element('button',undefined,'customer');btn.type='button';btn.dataset.customerId=c.id;btn.setAttribute('aria-current',String(c.id===selectedId));btn.setAttribute('aria-label',`查看${c.name}的详情`);const row=element('span',undefined,'row');row.append(element('strong',c.name),element('span',c.stage,'status'));btn.append(row,element('div',`${c.id}　${c.segment}　${c.industry}`,'sub'));btn.addEventListener('click',()=>{location.hash=`customer/${c.id}`;});li.append(btn);list.append(li);}}
function renderDetail(){const c=CUSTOMERS.find(c=>c.id===selectedId);const target=document.getElementById('detail');target.replaceChildren();if(!c){target.append(element('p','未找到该客户。'));return;}const back=element('button','返回客户列表','outline mobile-back');back.type='button';back.addEventListener('click',()=>{location.hash='customers';});const top=element('div',undefined,'detail-top');top.append(element('span',c.name.slice(-1),'avatar'),element('h2',c.name),element('p',`${c.id} · ${c.segment}`,'muted'));const facts=element('dl',undefined,'facts');for(const [label,value] of [['服务阶段',c.stage],['所属行业',c.industry],['客户经理',c.owner],['数据性质','虚构演示数据']]){const entry=element('div');entry.append(element('dt',label),element('dd',value));facts.append(entry);}const note=element('div',undefined,'note');note.append(element('h3','服务背景'),element('p',c.summary),element('p',c.note,'muted'));target.append(back,top,facts,note);}
function route(){const m=location.hash.match(/^#customer\/(demo-\d{3})$/);const exists=m&&CUSTOMERS.some(c=>c.id===m[1]);if(exists)selectedId=m[1];document.getElementById('layout').dataset.detail=String(Boolean(exists));renderList();renderDetail();}
search.addEventListener('input',renderList);segment.addEventListener('change',renderList);document.getElementById('reset').addEventListener('click',()=>{search.value='';segment.value='all';renderList();search.focus();});window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
